name: Release Build

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          # Single-platform, daemon-loaded, no attestation manifest so the
          # Container Structure Tests can inspect the image (an OCI index would
          # fail with "no such image"). See TEST.md troubleshooting.
          load: true
          provenance: false
          platforms: linux/amd64
          tags: ragedunicorn/python:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run Container Structure Tests
        env:
          PYTHON_TEST_VERSION: test
        run: |
          echo "::notice title=🧪 Running Tests::Validating Docker image before release..."
          docker compose -f docker-compose.test.yml pull

          echo "::group::Running all Container Structure Tests"
          docker compose -f docker-compose.test.yml run --rm test-all
          echo "::endgroup::"

          echo "::notice title=✅ Tests Passed::All Container Structure Tests completed successfully!"

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ secrets.DOCKERHUB_USERNAME }}/python
          tags: |
            # Use the tag as-is, stripping only the 'v' prefix
            type=match,pattern=v(.*),group=1
            # Also create Python major version tag (e.g. 3)
            type=match,pattern=v(\d+)[.-].*,group=1,enable=${{ !contains(github.ref, '-rc') && !contains(github.ref, '-beta') && !contains(github.ref, '-alpha') }}
            # 'latest' tag for version tags (skipped for prereleases)
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-rc') && !contains(github.ref, '-beta') && !contains(github.ref, '-alpha') }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}

  create-release:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Get previous tag
        id: prev_tag
        run: |
          # Order by tag version, not by tagged commit, so a rebuild tag (-N bump)
          # sharing a commit with the previous release still resolves correctly
          PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | grep -Fx -A1 "$GITHUB_REF_NAME" | sed -n 2p)
          echo "previous_tag=$PREV_TAG" >> $GITHUB_OUTPUT
      - name: Generate changelog
        id: changelog
        run: |
          if [ -z "${{ steps.prev_tag.outputs.previous_tag }}" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" --reverse)
          else
            COMMITS=$(git log ${{ steps.prev_tag.outputs.previous_tag }}..${{ github.ref_name }} --pretty=format:"- %s (%h)" --reverse)
          fi

          # Create changelog
          {
            echo "## What's Changed"
            echo ""
            echo "$COMMITS" | grep -E "^- (feat|fix|docs|style|refactor|perf|test|chore)(\(.+\))?:" || echo "$COMMITS"
            echo ""
            echo "## Docker Image"
            echo ""
            echo "Pull the image:"
            echo '```bash'
            echo "docker pull ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME#v}"
            echo "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/python:${GITHUB_REF_NAME#v}"
            echo '```'
            echo ""
            echo "Or use the latest tag:"
            echo '```bash'
            echo "docker pull ghcr.io/${{ github.repository }}:latest"
            echo "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/python:latest"
            echo '```'
            echo ""
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.prev_tag.outputs.previous_tag }}...${{ github.ref_name }}"
          } > CHANGELOG.md

          # Store for release body
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "body<<$EOF" >> $GITHUB_OUTPUT
          cat CHANGELOG.md >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          generate_release_notes: false
          token: ${{ secrets.GITHUB_TOKEN }}
